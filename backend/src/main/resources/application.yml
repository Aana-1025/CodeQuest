spring:
  application:
    name: codequest-backend
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET:dev-only-change-this-secret-dev-only-change-this-secret}
  access-minutes: ${JWT_ACCESS_MINUTES:15}
auth:
  refresh-token-days: ${REFRESH_TOKEN_DAYS:7}
logging:
  level:
    root: INFO
