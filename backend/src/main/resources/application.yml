spring:
  application:
    name: codequest-backend
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET:dev-only-change-this-secret-dev-only-change-this-secret}
  access-minutes: ${JWT_ACCESS_MINUTES:15}
auth:
  refresh-token-days: ${REFRESH_TOKEN_DAYS:7}
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-1.5-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
piston:
  base-url: ${PISTON_BASE_URL:https://emkc.org/api/v2/piston}
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
logging:
  level:
    root: INFO
