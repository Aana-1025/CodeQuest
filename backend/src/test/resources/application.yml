spring:
  datasource:
    url: jdbc:h2:mem:codequest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
  flyway:
    enabled: false
jwt:
  secret: test-jwt-secret-dev-only-change-this-secret
  access-minutes: 15
auth:
  refresh-token-days: 7
gemini:
  api-key: test-gemini-api-key
  model: test-gemini-model
  base-url: https://example.test/gemini
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
